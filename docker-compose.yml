# Postgres local do motor. Mesmo schema que vai pro Supabase — é a prova de portabilidade (AC14).
services:
  postgres:
    image: postgres:16-alpine
    container_name: sdc-motor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: motor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-motor}   # dev: motor; fora do laptop, defina POSTGRES_PASSWORD
      POSTGRES_DB: motor
    ports:
      - "127.0.0.1:55432:5432"                        # só loopback: o banco nunca fica exposto na rede
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motor -d motor"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:                     # roda antes do motor: aplica db/migrations e sai
    profiles: ["motor"]
    build: .
    command: ["node", "dist/cli/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: motor
      PGPASSWORD: ${POSTGRES_PASSWORD:-motor}
      PGDATABASE: motor
  motor:                       # docker compose --profile motor up  → migrate + motor + Postgres, sem Supabase
    profiles: ["motor"]
    build: .
    container_name: sdc-motor
    restart: unless-stopped
    stop_grace_period: 70s                                   # main.ts espera até 60 s por escrita financeira em andamento
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGUSER: motor
      PGPASSWORD: ${POSTGRES_PASSWORD:-motor}
      PGDATABASE: motor
      ASAAS_URL: ${ASAAS_URL:-https://api-sandbox.asaas.com/v3}
      ASAAS_API_KEY: ${ASAAS_API_KEY}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN}
      ODOO_URL: ${ODOO_URL:-}
      ODOO_DB: ${ODOO_DB:-}
      ODOO_API_KEY: ${ODOO_API_KEY:-}
      ODOO_WEBHOOK_KEY: ${ODOO_WEBHOOK_KEY}
      CONSOLE_TOKEN: ${CONSOLE_TOKEN:-}
      PORT: "8787"
    ports:
      - "8787:8787"
volumes:
  pgdata:
